name: Bump version and build

on:
  push:
    branches: ["main"]
    paths:
      - 'subgen.py'
      - 'language_code.py'
      - 'launcher.py'
      - 'requirements.txt'
      - 'entrypoint.sh'
      - 'Dockerfile.cpu'
      - '.github/workflows/bump_version.yml'
      - '.github/workflows/build_CPU.yml'
      - '.github/actions/assert-tag-absent/**'
  workflow_dispatch:

permissions: {}

jobs:
  bump:
    # Skip the commit this workflow itself creates to avoid an infinite loop
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    # Job-level, so a queued bump never waits on (or gets replaced behind) a build
    concurrency:
      group: bump-version
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.new }}
      sha: ${{ steps.ver.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Use the default token — contents: write permission above is enough
          ref: main
          fetch-depth: 1

      - name: Bump, commit and push
        id: ver
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Retry when main moves between checkout and push
          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git reset --hard origin/main
            current=$(grep -oP "subgen_version\s*=\s*'\K[^']+" subgen.py)
            year_now=$(date +%Y)
            month_now=$(date +%m)
            year_cur=$(echo "$current" | cut -d. -f1)
            month_cur=$(echo "$current" | cut -d. -f2)
            patch_cur=$(echo "$current" | cut -d. -f3)

            if [ "$year_now" = "$year_cur" ] && [ "$month_now" = "$month_cur" ]; then
              new_version="$year_now.$month_now.$((patch_cur + 1))"
            else
              new_version="$year_now.$month_now.1"
            fi

            sed -i "s/subgen_version = '$current'/subgen_version = '$new_version'/" subgen.py
            grep -q "subgen_version = '$new_version'" subgen.py
            git add subgen.py
            git commit -m "Bump version to $new_version"
            if git push origin HEAD:main; then
              {
                echo "old=$current"
                echo "new=$new_version"
                echo "sha=$(git rev-parse HEAD)"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::push attempt $attempt rejected, retrying on new main"
          done
          exit 1

  # GITHUB_TOKEN pushes trigger no workflows, so the bump commit is built here
  build-cpu:
    needs: bump
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build_CPU.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}
      version: ${{ needs.bump.outputs.version }}
