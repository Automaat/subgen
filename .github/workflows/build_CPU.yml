name: Build CPU Docker image

# No push trigger: it would tag new code with the pre-bump version
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        required: true
        type: string
      version:
        description: Expected subgen_version at that commit
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Per version: a shared group would replace queued builds of other versions
    concurrency:
      group: docker-cpu-${{ inputs.version || github.sha }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Get version from subgen.py
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          version=$(grep -oP "subgen_version\s*=\s*'\K[^']+" subgen.py)
          if [ -n "$EXPECTED_VERSION" ] && [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "::error::subgen.py has $version, expected $EXPECTED_VERSION"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Set image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/subgen" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a released version
        uses: ./.github/actions/assert-tag-absent
        with:
          image: ${{ env.IMAGE }}:${{ env.version }}-cpu

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.cpu
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:cpu
            ${{ env.IMAGE }}:${{ env.version }}-cpu
          cache-from: type=gha
          cache-to: type=gha,mode=max
